<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FB Marketplace Smart Search</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>FB Marketplace Smart Search</h1>
      <p>
        Facebook still runs the search. A result stays visible only if every word
        appears in its title or description, in any order. Matching words are
        highlighted. If a word is missing from both, the item is hidden.
      </p>
      <label>
        <input type="checkbox" id="enabled" checked />
        Filter Marketplace results
      </label>
      <a id="open" href="https://www.facebook.com/marketplace/" target="_blank" rel="noreferrer">
        Open Marketplace
      </a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
